<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idébank</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; background: #f7f7f5; color: #222; }
  h1 { margin-bottom: 4px; }
  .sub { color: #666; margin-top: 0; }
  .ide, details { background: #fff; border-radius: 10px; padding: 14px 16px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  summary { cursor: pointer; font-weight: 600; }
  #kriterier-tekst { font-size: 14px; }
  #kriterier-tekst h1 { font-size: 18px; }
  #kriterier-tekst h2 { font-size: 15px; margin-bottom: 2px; }
  #kriterier-tekst p { margin-top: 2px; }
  .rad { display: flex; align-items: center; gap: 14px; }
  .score { font-size: 26px; font-weight: 700; min-width: 56px; text-align: center; border-radius: 8px; padding: 6px 0; color: #fff; }
  .tittel { font-size: 18px; font-weight: 600; }
  .meta { color: #777; font-size: 13px; }
  button { margin-top: 10px; border: 1px solid #ccc; background: #fafafa; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .begrunnelse { margin-top: 10px; font-size: 14px; overflow-x: auto; }
  .begrunnelse table { border-collapse: collapse; }
  .begrunnelse td, .begrunnelse th { border: 1px solid #ddd; padding: 4px 8px; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>Idébank</h1>
<p class="sub">Ideer vi kan gjøre sammen – rangert av Claude etter kriteriene våre.</p>
<details>
  <summary>Slik vurderer Claude ideene</summary>
  <div id="kriterier-tekst">Laster …</div>
</details>
<div id="liste">Laster …</div>
<script>
const eier = location.hostname.split('.')[0];
const repo = location.pathname.split('/')[1];
const api = 'https://api.github.com/repos/' + eier + '/' + repo;

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function farge(s) {
  if (s === null) return '#999';
  if (s >= 75) return '#2e7d32';
  if (s >= 50) return '#f9a825';
  return '#c62828';
}

function hentScore(issue) {
  for (const l of issue.labels) {
    const m = /^score-(\d+)$/.exec(l.name);
    if (m) return parseInt(m[1], 10);
  }
  return null;
}

async function visBegrunnelse(nr, knapp) {
  const boks = document.getElementById('b' + nr);
  if (boks.innerHTML) { boks.innerHTML = ''; knapp.textContent = 'Vis begrunnelse'; return; }
  boks.textContent = 'Henter …';
  const r = await fetch(api + '/issues/' + nr + '/comments', { headers: { Accept: 'application/vnd.github.html+json' } });
  const kommentarer = await r.json();
  const k = kommentarer.reverse().find(c => (c.body_html || '').includes('Score'));
  boks.innerHTML = k ? k.body_html : 'Ingen begrunnelse ennå.';
  knapp.textContent = 'Skjul begrunnelse';
}

async function hentKriterier() {
  const boks = document.getElementById('kriterier-tekst');
  try {
    const r = await fetch(api + '/contents/kriterier.md', { headers: { Accept: 'application/vnd.github.html+json' } });
    if (!r.ok) throw new Error();
    boks.innerHTML = await r.text();
  } catch (e) {
    boks.textContent = 'Klarte ikke å hente kriteriene.';
  }
}

async function last() {
  const liste = document.getElementById('liste');
  try {
    const r = await fetch(api + '/issues?state=open&per_page=100');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const ideer = (await r.json()).filter(i => !i.pull_request);
    ideer.forEach(i => i.score = hentScore(i));
    ideer.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
    if (!ideer.length) { liste.textContent = 'Ingen ideer ennå.'; return; }
    liste.innerHTML = ideer.map(i => `
      <div class="ide">
        <div class="rad">
          <div class="score" style="background:${farge(i.score)}">${i.score ?? '…'}</div>
          <div>
            <div class="tittel"><a href="${i.html_url}">${esc(i.title)}</a></div>
            <div class="meta">${esc(i.user.login)} · ${new Date(i.created_at).toLocaleDateString('no-NO')}${i.score === null ? ' · venter på vurdering' : ''}</div>
          </div>
        </div>
        <button onclick="visBegrunnelse(${i.number}, this)">Vis begrunnelse</button>
        <div class="begrunnelse" id="b${i.number}"></div>
      </div>`).join('');
  } catch (e) {
    liste.textContent = 'Klarte ikke å hente ideer (' + e.message + '). Prøv igjen om litt.';
  }
}

hentKriterier();
last();
</script>
</body>
</html>
